<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陈旭杰 | 重庆大学 · 电气工程及其自动化</title>
  <meta name="description" content="陈旭杰的个人主页 - 重庆大学电气工程及其自动化专业学生，已获得人工智能训练师初级与高级认证。">
  <style>
    /* ===== 设计变量 ===== */
    :root {
      --primary: #4f46e5;
      --primary-600: #4338ca;
      --accent: #06b6d4;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 30px -10px rgba(30, 41, 59, 0.12);
      --radius: 16px;
      --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
    }

    @media print {
      :root {
        --bg: #fff !important;
        --surface: #fff !important;
        --text: #000 !important;
        --text-secondary: #333 !important;
        --border: #ddd !important;
        --shadow: none !important;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      transition: background var(--transition), color var(--transition);
    }

    /* 背景纹理 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.06) 0%, transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 25%);
      pointer-events: none;
      z-index: -1;
    }

    /* ===== 导航 ===== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(var(--surface), 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 5vw, 64px);
      transition: background var(--transition), border-color var(--transition);
    }

    [data-theme="dark"] .nav { background: rgba(15, 23, 42, 0.85); }

    .nav-name {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color var(--transition);
    }

    .nav-links a:hover { color: var(--primary); }

    .nav-btns {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .icon-btn:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: var(--shadow);
    }

    .print-btn {
      width: auto;
      padding: 0 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      gap: 6px;
    }

    .menu-toggle { display: none; }

    /* ===== 容器 ===== */
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 100px clamp(16px, 5vw, 40px) 60px;
    }

    section { margin-bottom: 64px; }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h2 .accent {
      width: 6px;
      height: 26px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--primary), var(--accent));
    }

    /* ===== Hero ===== */
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 40px;
      align-items: center;
      min-height: calc(100vh - 160px);
    }

    .hero-title {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .hero-title span {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-role {
      font-size: 1.25rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    .hero-summary {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 560px;
      margin-bottom: 1.75rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
    }

    .badge {
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: rgba(79, 70, 229, 0.08);
      color: var(--primary);
      border: 1px solid rgba(79, 70, 229, 0.12);
      transition: transform var(--transition), background var(--transition);
    }

    .badge:hover { transform: translateY(-2px); background: rgba(79, 70, 229, 0.12); }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.7rem 1.3rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-600));
      color: #fff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45); }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { transform: translateY(-2px); border-color: var(--primary); }

    .avatar {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      object-fit: cover;
      background: linear-gradient(135deg, var(--primary), var(--accent));
    }

    .avatar::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(79, 70, 229, 0.15);
      pointer-events: none;
    }

    .avatar-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      font-weight: 900;
      color: #fff;
    }

    /* ===== 卡片与时间线 ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(30, 41, 59, 0.18);
      border-color: rgba(79, 70, 229, 0.25);
    }

    [data-theme="dark"] .card:hover { box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.35); }

    .highlights {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding-bottom: 0.75rem;
      -webkit-overflow-scrolling: touch;
    }

    .highlights::-webkit-scrollbar {
      height: 6px;
    }

    .highlights::-webkit-scrollbar-track {
      background: var(--border);
      border-radius: 3px;
    }

    .highlights::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 3px;
    }

    .highlight-card {
      flex: 0 0 auto;
      width: 240px;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .highlight-number {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .highlight-label { color: var(--text-secondary); font-size: 0.9rem; }

    /* ===== Tabs ===== */
    .tabs {
      display: flex;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .tab {
      padding: 0.6rem 1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      transition: color var(--transition), border-color var(--transition);
      font-size: 0.95rem;
    }

    .tab:hover { color: var(--primary); }

    .tab[aria-selected="true"] {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-panel { display: none; animation: fadeIn 250ms ease; }

    .tab-panel.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    .timeline { position: relative; padding-left: 24px; }

    .timeline::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--border);
    }

    .timeline-item { position: relative; margin-bottom: 1.75rem; }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 2px var(--primary);
    }

    .timeline-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.4rem; }

    .timeline-title { font-weight: 700; font-size: 1.05rem; }

    .timeline-company { color: var(--primary); font-weight: 600; font-size: 0.9rem; }

    .timeline-date { color: var(--text-secondary); font-size: 0.85rem; }

    .timeline-desc { color: var(--text-secondary); font-size: 0.92rem; }

    .timeline-desc ul { margin-left: 1.1rem; margin-top: 0.4rem; }

    .timeline-desc li { margin-bottom: 0.25rem; }

    /* ===== 项目 ===== */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .project-card h3 { font-size: 1.1rem; margin-bottom: 0.35rem; }

    .project-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.75rem 0;
    }

    .tech-tag {
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .project-links { display: flex; gap: 0.6rem; margin-top: 0.75rem; }

    .project-links a {
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .project-links a:hover { text-decoration: underline; }

    /* ===== 技能矩阵 ===== */
    .skills-grid {
      display: flex;
      gap: 1.25rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding-bottom: 0.75rem;
      -webkit-overflow-scrolling: touch;
    }

    .skills-grid::-webkit-scrollbar {
      height: 6px;
    }

    .skills-grid::-webkit-scrollbar-track {
      background: var(--border);
      border-radius: 3px;
    }

    .skills-grid::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 3px;
    }

    .skill-category {
      flex: 0 0 auto;
      width: 280px;
      scroll-snap-align: start;
    }

    .skill-category h3 { font-size: 1rem; margin-bottom: 0.75rem; color: var(--text-secondary); }

    .skill-item { margin-bottom: 0.75rem; }

    .skill-top { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 0.25rem; }

    .skill-bar {
      height: 7px;
      border-radius: 4px;
      background: var(--border);
      overflow: hidden;
    }

    .skill-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      width: 0;
      transition: width 800ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== 教育 ===== */
    .edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }

    .cert-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }

    .cert-heading {
      font-size: 1.15rem;
      margin: 2rem 0 1rem;
      color: var(--text);
    }

    .cert-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .cert-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .cert-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(30, 41, 59, 0.18); }

    .cert-card img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: block;
      background: var(--bg);
    }

    .cert-card .caption {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .cert-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      border: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
      text-align: center;
      padding: 1rem;
      background: var(--bg);
    }

    /* ===== 页脚与返回顶部 ===== */
    .footer {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    .back-top {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform var(--transition), opacity var(--transition);
      z-index: 90;
    }

    .back-top.visible { display: inline-flex; }

    .back-top:hover { transform: translateY(-3px); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: var(--bg);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transition: transform var(--transition), opacity var(--transition);
      z-index: 200;
    }

    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ===== 双语切换 ===== */
    .lang-switch {
      position: fixed;
      right: 24px;
      top: 80px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem;
      display: none;
      box-shadow: var(--shadow);
      z-index: 90;
    }

    .lang-switch.visible { display: flex; }

    .lang-btn {
      padding: 0.35rem 0.85rem;
      border-radius: 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .lang-btn.active { background: var(--primary); color: #fff; }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 0.5rem 1rem;
      }
      .nav.menu-open .nav-links { display: flex; }
      .nav-links a {
        padding: 0.85rem 0.5rem;
        font-size: 1rem;
        border-bottom: 1px solid var(--border);
      }
      .nav-links a:last-child { border-bottom: none; }
      .menu-toggle { display: inline-flex; }
      .hero { grid-template-columns: 1fr; text-align: center; }
      .avatar { width: 140px; height: 140px; margin: 0 auto; order: -1; }
      .badges, .hero-actions { justify-content: center; }
      .project-grid, .edu-grid, .cert-gallery { grid-template-columns: 1fr; }
      .skill-category { width: 260px; }
      .highlight-card { width: 220px; }
      .timeline-header { flex-direction: column; }
    }

    @media print {
      .nav, .back-top, .lang-switch, .icon-btn, .hero-actions { display: none !important; }
      .container { padding-top: 24px; }
      .card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
      .tab-panel { display: block !important; }
      .tabs { display: none; }
      a { text-decoration: none; color: #000; }
      body::before { display: none; }
    }
  </style>
</head>

  <nav class="nav" role="navigation" aria-label="主导航">

  <main class="container">
    <!-- Hero -->
    <section class="hero" id="about">
      <div>
        <h1 class="hero-title"><span data-i18n="name">陈旭杰</span></h1>
        <p class="hero-role" data-i18n="role">重庆大学 · 电气工程及其自动化 · 2026级本科生</p>

    function renderTabs(containerId, panelsId, tabsData, panelsData, renderer) {
      const tabContainer = $(`#${containerId}`);
      const panelContainer = $(`#${panelsId}`);
      tabContainer.innerHTML = "";
      panelContainer.innerHTML = "";

      tabsData.forEach((tab, idx) => {
        const btn = document.createElement("button");
        btn.className = "tab";
        btn.textContent = tab.label;
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", idx === 0 ? "true" : "false");
        btn.setAttribute("aria-controls", `${panelsId}-${tab.key}`);
        btn.setAttribute("tabindex", idx === 0 ? "0" : "-1");
        btn.dataset.tab = tab.key;
        btn.dataset.panelGroup = panelsId;
        btn.addEventListener("click", () => activateTab(panelsId, tab.key));
        btn.addEventListener("keydown", (e) => handleTabKey(e, panelsId));
        tabContainer.appendChild(btn);

        const panel = document.createElement("div");
        panel.className = `tab-panel${idx === 0 ? " active" : ""}`;
        panel.id = `${panelsId}-${tab.key}`;
        panel.setAttribute("role", "tabpanel");
        panel.setAttribute("aria-labelledby", `${panelsId}-tab-${tab.key}`);
        panel.innerHTML = renderer(panelsData[tab.key]);
        panelContainer.appendChild(panel);
      });
    }

    function activateTab(group, key) {
      const tabs = $$(`.tab[data-panel-group="${group}"]`);
      const panels = $$(`#${group} ~ div .tab-panel, #${group.replace("Tabs", "Panels")} .tab-panel`);
      tabs.forEach(t => {
        const active = t.dataset.tab === key;
        t.setAttribute("aria-selected", active);
        t.setAttribute("tabindex", active ? "0" : "-1");
      });
      $$(`#${group.replace("Tabs", "Panels")} .tab-panel`).forEach(p => {
        p.classList.toggle("active", p.id === `${group.replace("Tabs", "Panels")}-${key}`);
      });
    }

    function handleTabKey(e, group) {
      const tabs = $$(`.tab[data-panel-group="${group}"]`);
      const idx = tabs.findIndex(t => t === document.activeElement);
      let nextIdx = idx;
      if (e.key === "ArrowRight") nextIdx = (idx + 1) % tabs.length;
      else if (e.key === "ArrowLeft") nextIdx = (idx - 1 + tabs.length) % tabs.length;
      else return;
      e.preventDefault();
      tabs[nextIdx].focus();
      activateTab(group, tabs[nextIdx].dataset.tab);
    }

        <div class="cert-placeholder">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <div>请把证书图片放到<br>${src}</div>
        </div>
      `;
    }

    function renderEducation() {
      const edu = resume[currentLang].education;
      $("#eduGrid").innerHTML = edu.map(e => `
        <div class="card">
          <div class="timeline-title">${e.school}</div>
          <div class="timeline-company">${e.major}</div>
          <div class="timeline-date">${e.date}</div>
          <div class="cert-list">
            ${e.certs.map(c => `<span class="badge">${c}</span>`).join("")}
          </div>
        </div>
      `).join("");

      // 渲染证书图片画廊
      const images = edu.flatMap(e => e.certImages || []);
      $("#certGallery").innerHTML = images.length ? images.map(img => `
        <div class="cert-card">
          <img src="${img.src}" alt="${img.alt}" loading="lazy" onerror="handleCertError(this, '${img.src}')">
          <div class="caption">${img.caption}</div>
        </div>
      `).join("") : "";
    }

    function renderLangSwitch() {
      if (supportedLangs.length < 2) return;
      const wrap = $("#langSwitch");
      wrap.classList.add("visible");
      wrap.innerHTML = supportedLangs.map(lang => `
        <button class="lang-btn${lang === currentLang ? " active" : ""}" data-lang="${lang}" aria-label="切换到 ${lang === "zh" ? "中文" : "English"}">${lang.toUpperCase()}</button>
      `).join("");
      wrap.querySelectorAll(".lang-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentLang = btn.dataset.lang;
          renderAll();
          renderLangSwitch();
        });
      });
    }

    function renderAll() {
      renderText();
      renderBadges();
      renderHighlights();
      renderExperience();
      renderProjects();
      renderSkills();
      renderEducation();
      $("#updateTime").textContent = new Date().toLocaleDateString(currentLang === "zh" ? "zh-CN" : "en-US");
      $("#year").textContent = new Date().getFullYear();
    }

    // ===== 主题 =====
    function initTheme() {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      $("#themeToggle").addEventListener("click", () => {
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
    }

    // ===== 邮箱复制 =====
    function initEmailCopy() {
      $("#copyEmailBtn").addEventListener("click", async () => {
        const addr = email(currentLang);
        try {
          await navigator.clipboard.writeText(addr);
          showToast(currentLang === "zh" ? "邮箱已复制" : "Email copied");
        } catch {
          showToast(currentLang === "zh" ? "复制失败" : "Copy failed");
        }
      });
    }

    function showToast(msg) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    // ===== 返回顶部 =====
    function initBackTop() {
      const btn = $("#backTop");
      window.addEventListener("scroll", () => {
        btn.classList.toggle("visible", window.scrollY > 400);
      });
      btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    }

    // ===== 移动端菜单 =====
    function initMenuToggle() {
      const toggle = $("#menuToggle");
      const nav = $(".nav");
      toggle.addEventListener("click", () => {
        const open = nav.classList.toggle("menu-open");
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        toggle.setAttribute("aria-label", open ? "关闭导航菜单" : "打开导航菜单");
      });
      // 点击链接后自动收起菜单
      $$(".nav-links a").forEach(link => {
        link.addEventListener("click", () => {
          nav.classList.remove("menu-open");
          toggle.setAttribute("aria-expanded", "false");
          toggle.setAttribute("aria-label", "打开导航菜单");
        });
      });
    }

    // ===== 初始化 =====
    renderAll();
    renderLangSwitch();
    initTheme();
    initEmailCopy();
    initBackTop();
    initMenuToggle();
  </script>
</body>
</html>
